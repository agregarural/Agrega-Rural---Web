<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    <link rel="stylesheet" href="../css/produtos.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <div id="menu-options"></div>

    <div class="container">
        <h2>Gestão de produtos</h2>
        <h5>Painel de Controle para gerenciamento dos produtos Pedrocoop</h5>

        <div class="container-btns">
            <button id="btnNovoProduto" class="btn">
                <img src="../assets/icons/plus.svg" class="iconBtn" alt="Adicionar">
                <p>NOVO PRODUTO</p>
            </button>

            <button id="btnNovaCategoria" class="btn">
                <img src="../assets/icons/plus.svg" class="iconBtn" alt="Adicionar">
                <p>NOVA CATEGORIA</p>
            </button>
        </div>

        <div class="listas">
            <div class="lista-produtos lista">
                <h3>PRODUTOS CADASTRADOS:</h3>
                <div id="conatiner-cards-produto">
                    <!-- Cards de produtos inseridos via JS -->
                </div>
            </div>

            <div class="lista-categorias lista">
                <h3>CATEGORIAS CADASTRADAS:</h3>
                <div id="conatiner-cards-categoria">
                    <!-- Cards de categorias inseridos via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay de Cadastro de Produto -->
    <div class="overlay oculto" id="overlayAddProduto">
        <div class="popup" id="popupAddProduto">
            <h3>Cadastrar Novo Produto</h3>
            <form id="formularioAddProduto">
                <label>Nome:</label>
                <input id="nomeProduto" type="text" class="inputProduto" placeholder="Nome do produto">
                <label>Categoria:</label>
                <select id="selectCategorias" class="inputProduto">
                    <option value="">Selecione uma categoria</option>
                </select>
                <label>Preço de Venda:</label>
                <input id="precoProduto" type="text" class="inputProduto" placeholder="0.00">
                <label>Custo de produção:</label>
                <input id="custoProducao" type="text" class="inputProduto" placeholder="0.00">
                <label>Quantidade em Estoque:</label>
                <input id="estoqueProduto" type="number" class="inputProduto" placeholder="0">
                <label>Descrição:</label>
                <textarea id="descricaoProduto" class="inputProduto" placeholder="Descrição do produto"></textarea>
                <label>Imagem do produto:</label>
                <input id="imagemProduto" type="file" class="inputImgProduto" name="Imagem" accept="image/*">
                <button id="btnAddProduto" class="addProduto" type="button">Adicionar produto</button>
            </form>
        </div>
    </div>

    <!-- Overlay de Edição de Produto -->
    <div class="overlay oculto" id="overlayEditProduto">
        <div class="popup" id="popupEditProduto">
            <h3>Editar Produto</h3>
            <form id="formularioEditProduto">
                <label>Nome:</label>
                <input id="editNomeProduto" type="text" class="inputProduto" placeholder="Nome do produto">
                <label>Categoria:</label>
                <select id="editSelectCategorias" class="inputProduto">
                    <option value="">Selecione uma categoria</option>
                </select>
                <label>Preço de Venda:</label>
                <input id="editPrecoProduto" type="text" class="inputProduto" placeholder="0.00">
                <label>Custo de produção:</label>
                <input id="editCustoProducao" type="text" class="inputProduto" placeholder="0.00">
                <label>Quantidade em Estoque:</label>
                <input id="editEstoqueProduto" type="number" class="inputProduto" placeholder="0">
                <label>Descrição:</label>
                <textarea id="editDescricaoProduto" class="inputProduto" placeholder="Descrição do produto"></textarea>
                <label>Imagem atual:</label>
                <img id="editPreviewImagem" src="" alt="Pré-visualização" style="max-width: 150px; margin: 5px; display: block;">
                <label>Nova imagem (opcional):</label>
                <input id="editImagemProduto" type="file" class="inputImgProduto" name="Imagem" accept="image/*">
                <button id="btnSalvarEdicao" class="addProduto" type="button">Salvar alterações</button>
            </form>
        </div>
    </div>

    <!-- Overlay de Nova Categoria -->
    <div class="overlay oculto" id="overlayAddCategoria">
        <div class="popup" id="popupAddCategoria">
            <h3>Cadastrar Nova Categoria</h3>
            <form id="formularioAddCategoria">
                <label>Nome da Categoria:</label>
                <input id="nomeCategoria" type="text" class="inputProduto" placeholder="Nome da categoria">
                <input id="imagemCategoria" type="file" class="inputImgProduto" name="Imagem" accept="image/*">
                <button id="btnAddCategoria" class="addProduto" type="submit">Adicionar categoria</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/produtos.js"></script>
</body>

</html>
