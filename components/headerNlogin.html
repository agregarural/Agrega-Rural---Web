<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
</head>

<body>

    <style>
        .header {
            display: flex;
            flex-direction: row;
            align-self: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 1rem;
            background-color: rgb(255, 255, 255);
            padding-right: 9%;
            padding-left: 9%;
        }

        #logoHeader {
            width: clamp(2rem, 4rem + 1vw, 6rem);
            height: auto;
            order: 1;
            margin-right: 1rem;
        }

        .textHeader {
            font-family: sans-serif;
            font-size: clamp(1rem, 5vw + 0.5rem, 2rem);
            flex-grow: 1;
            font-weight: 550;
            flex-shrink: 0;
            order: 1;
            color: black;
        }

        .btnHeader {
            width: clamp(1.5rem, 10vw + 1.5rem, 7rem);
            margin-right: clamp(1rem, 10vw + 1rem, 1.5rem);
            height: auto;
            font-size: clamp(1rem, 0.4vw + 0.1rem, 2rem);
            flex-shrink: 0;
            border: 0px;
            background-color: transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .btnHeader:hover {
            color: #4a7c3f;
            text-decoration: underline;
        }

        .divBtnHeader {
            display: flex;
            order: 3;
            flex-wrap: wrap;
        }

        .naoquebra {
            white-space: nowrap;
        }

        .btnEntrar {
            padding: 0.6rem 1.5rem;
            font-size: clamp(0.9rem, 0.4vw + 0.1rem, 1.3rem);
            font-weight: 600;
            font-family: sans-serif;
            border: 2px solid #4a7c3f;
            border-radius: 2rem;
            background-color: #4a7c3f;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            order: 4;
            white-space: nowrap;
        }

        .btnEntrar:hover {
            background-color: white;
            color: #4a7c3f;
        }

        .btnEntrar:active {
            transform: scale(0.95);
        }

        @media (max-width: 1230px) {
            .header {
                justify-content: center;
            }

            .divBtnHeader {
                order: 4;
                text-align: center;
            }

            .btnEntrar {
                order: 3;
            }
        }
    </style>

    <header class="header">
        <img src="../assets/img/logo.png" id="logoHeader" alt="Logo Agrega Rural">
        <h1 class="textHeader">AGREGA RURAL</h1>

        <div class="divBtnHeader">
            <button class="btnHeader" onclick="window.location.href='../pages/home1.html'">HOME</button>
            <button class="btnHeader"><span class="naoquebra">SOBRE NÓS</span></button>
            <button class="btnHeader">PRODUTOS</button>
            <button class="btnHeader">CONTATO</button>
        </div>

        <button class="btnEntrar">ENTRAR</button>
    </header>
</body>

<script>




</script>

</html>
