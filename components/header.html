<style>
    .header {
        display: flex;
        flex-direction: row;
        align-self: center;
        align-items: center;
        flex-wrap: wrap;
        padding: 1rem;
        background-color: rgb(255, 255, 255);
        padding-right: 9%;
        padding-left: 9%;
    }

    #logoHeader {
        width: clamp(2rem, 20%, 4rem);
        height: auto;
        order: 1;
        margin-right: 1rem;
        cursor: pointer;
    }

    .textHeader {
        font-family: sans-serif;
        font-size: clamp(1rem, 170%, 2rem);
        flex-grow: 1;
        font-weight: 550;
        flex-shrink: 0;
        order: 1;
        color: black;
        cursor: pointer;
    }

    .btnProfile {
        width: clamp(1rem, 0.5rem + 2vw, 5rem);
        height: auto;
        border: 0;
        border-radius: 5rem;
        background-color: transparent;
        flex-shrink: 0;
        transition: 0.1s;
        order: 4;
        cursor: pointer;
    }

    .btnProfile:active {
        transform: scale(0.9);
    }

    #profileImage {
        width: clamp(1rem, 0.5rem + 4vw, 3rem);
        height: clamp(1rem, 0.5rem + 4vw, 3rem);
        object-fit: cover;
        border-radius: 50%;
    }

    @media (max-width: 1092px) {
        .header {
            justify-content: center;
        }

        .btnProfile {
            order: 3;
        }
    }
</style>

<header class="header">
    <img 
        src="../assets/img/logoCenter.jpg" 
        id="logoHeader" 
        alt="Logo Agrega Rural"
        onclick="window.location.href='../pages/home.html'"
    >

    <h1 
        class="textHeader"
        onclick="window.location.href='../pages/home.html'"
    >
        AGREGA RURAL
    </h1>

    <button 
        class="btnProfile" 
        type="button"
        onclick="window.location.href='../pages/meuperfil.html'"
    >
        <img src="../assets/img/perfil.jpg" id="profileImage" alt="Perfil">
    </button>
</header>
